# Fork-local CI for paige/Navic -> fm.qingting.qtradio
#
# Why this exists: the local box (4 cores / 9 GB, no JDK 21, no gradle 9.8.2)
# cannot build this project, and every Maven/Gradle host is unreachable from it
# without a proxy. GitHub's runner has JDK 21 and a working network.
#
# Fork-local changes this workflow depends on (see the commits on master):
#   * app/build.gradle.kts  -> applicationId fm.qingting.qtradio, versionCode
#                              11000400, abiFilters reduced to arm64-v8a only
#   * gradle.properties     -> heaps lowered to 4g / 2g for the 16 GB runner
#
# Release, not debug, on purpose: an APK signed with the runner's throwaway
# debug keystore gets a different signature on every run, so each rebuild would
# have to be uninstalled first - losing all app data (server config, caches).
# The keystore is reconstructed from Actions secrets, so rebuilds upgrade in place.
#
# fdroid flavour, not default: BuildConfig.FDROID gates off the upstream update
# checker (which compares digit-runs in the release tag against the local
# versionName and would nag on every launch, because our versionName is a spoof)
# and the Discord RPC integration.
#
# Note on android-actions/setup-android: it was removed deliberately. Its
# `sdkmanager --licenses` call exits 1 in this environment ("7 of 8 SDK package
# licenses not accepted" then a y/N prompt with no stdin), which failed the job
# before Gradle ever ran. Licences are accepted non-interactively below instead,
# and AGP provisions platform/build-tools/NDK itself once they are accepted.

name: build-arm64

on:
  workflow_dispatch:
  push:
    branches: [master]
    # Docs never change the APK, and a rebuild costs a full FFmpeg compile.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.forgejo/**'

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: arm64 release APK (fdroid)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout (submodules are build inputs, not optional)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 21 (project pins jvmToolchain(21))
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licences
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "no sdkmanager found; looked under $SDK/cmdline-tools/*/bin and \$PATH"
            ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager=$SM"
          # sdkmanager exits 1 when licences are merely *offered*, so the exit code
          # is not meaningful here - only whether they are accepted afterwards.
          yes | "$SM" --licenses > /tmp/licences.log 2>&1 || true
          grep -c "Accept" /tmp/licences.log 2>/dev/null || true
          "$SM" --list_installed 2>/dev/null | sed -n '1,40p' || true

      - name: Show environment
        run: |
          java -version
          echo "cores=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G disk=$(df -h / | tail -1 | awk '{print $4}')"
          git submodule status | head -5

      - name: Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Signing material is not in the repo; it is reconstructed from secrets.
      - name: Assemble arm64 release APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYSTORE_B64:-}" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/navic-release.jks"
            export SIGNING_STORE_FILE="$RUNNER_TEMP/signing/navic-release.jks"
            export SIGNING_KEY_ALIAS="navic"
            echo "signing: keystore restored from secret"
          else
            echo "signing: SIGNING_KEYSTORE_B64 not set - release APK will be UNSIGNED"
          fi
          ./gradlew :app:assembleFdroidRelease --no-daemon --stacktrace

      - name: Verify what actually got built
        if: always()
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)
          for f in $(find app/build/outputs/apk -name '*.apk' 2>/dev/null); do
            echo "=== $f ==="
            "$AAPT" dump badging "$f" 2>/dev/null | grep -E "^package:|^application-label:|^native-code:|^sdkVersion:" || true
            unzip -l "$f" 2>/dev/null | grep -E "lib/" || true
          done

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \; || true
          ls -lh out/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navic-arm64-release
          path: out/*.apk
          if-no-files-found: error
          compression-level: 0
