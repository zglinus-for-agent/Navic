# Gradle
# Fork-local change: upstream asks for -Xmx8g on both the Gradle and the Kotlin
# daemon, i.e. 16 GB total, which does not fit a 16 GB GitHub runner (let alone
# the 9 GB box this fork was made on). Lowered to 4g / 2g.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Xmx4g -Xms1g
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=768m -Xmx2g -Xms512m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false
